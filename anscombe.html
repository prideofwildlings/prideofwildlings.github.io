<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anscombe's Quartet</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
      background: #fff;
    }
    h1 { margin-bottom: 4px; }
    p.intro { color: #555; line-height: 1.5; max-width: 680px; }
    #charts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-top: 24px;
    }
    .panel h2 { font-size: 16px; margin: 0 0 4px; }
    .stats { font-size: 12px; color: #666; margin: 0; }
    .dot { fill: #2b6cb0; opacity: 0.85; }
    .fit { stroke: #d9480f; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .axis text { font-size: 11px; }
    @media (max-width: 600px) {
      #charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h1>Anscombe's Quartet</h1>
  <p class="intro">
    Four datasets with nearly identical summary statistics (mean, variance,
    correlation and linear regression line) that look completely different
    when plotted. Created by statistician Francis Anscombe in 1973 to show
    why data should be visualized, not just summarized.
  </p>

  <div id="charts"></div>

  <script>
    // ---------- 1. DATA ----------
    // The four datasets. Sets I–III share the same x values.
    const xShared = [10, 8, 13, 9, 11, 14, 6, 4, 12, 7, 5];

    const datasets = [
      { name: "Dataset I",
        x: xShared,
        y: [8.04, 6.95, 7.58, 8.81, 8.33, 9.96, 7.24, 4.26, 10.84, 4.82, 5.68] },
      { name: "Dataset II",
        x: xShared,
        y: [9.14, 8.14, 8.74, 8.77, 9.26, 8.10, 6.13, 3.10, 9.13, 7.26, 4.74] },
      { name: "Dataset III",
        x: xShared,
        y: [7.46, 6.77, 12.74, 7.11, 7.81, 8.84, 6.08, 5.39, 8.15, 6.42, 5.73] },
      { name: "Dataset IV",
        x: [8, 8, 8, 8, 8, 8, 8, 19, 8, 8, 8],
        y: [6.58, 5.76, 7.71, 8.84, 8.47, 7.04, 5.25, 12.50, 5.56, 7.91, 6.89] }
    ];

    // ---------- 2. CHART SIZE ----------
    const margin = { top: 10, right: 15, bottom: 35, left: 40 };
    const width  = 400 - margin.left - margin.right;
    const height = 300 - margin.top - margin.bottom;

    // Same scales for all four charts, so they can be compared fairly
    // ("position along a common scale")
    const xScale = d3.scaleLinear().domain([2, 20]).range([0, width]);
    const yScale = d3.scaleLinear().domain([2, 14]).range([height, 0]);

    // ---------- 3. DRAW ONE CHART PER DATASET ----------
    datasets.forEach(set => {

      // Turn the two arrays into a list of {x, y} points
      const points = set.x.map((x, i) => ({ x: x, y: set.y[i] }));

      // Summary statistics
      const meanX = d3.mean(set.x);
      const meanY = d3.mean(set.y);
      const slope = d3.sum(points, p => (p.x - meanX) * (p.y - meanY)) /
                    d3.sum(points, p => (p.x - meanX) ** 2);
      const intercept = meanY - slope * meanX;
      const r = d3.sum(points, p => (p.x - meanX) * (p.y - meanY)) /
                Math.sqrt(d3.sum(points, p => (p.x - meanX) ** 2) *
                          d3.sum(points, p => (p.y - meanY) ** 2));

      // A container for the title, stats and chart
      const panel = d3.select("#charts").append("div").attr("class", "panel");
      panel.append("h2").text(set.name);
      panel.append("p").attr("class", "stats").text(
        `mean x = ${meanX.toFixed(2)}, mean y = ${meanY.toFixed(2)}, ` +
        `r = ${r.toFixed(3)}, y = ${slope.toFixed(2)}x + ${intercept.toFixed(2)}`
      );

      // The SVG canvas
      const svg = panel.append("svg")
          .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
          .style("width", "100%")
        .append("g")
          .attr("transform", `translate(${margin.left},${margin.top})`);

      // Axes
      svg.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(0,${height})`)
        .call(d3.axisBottom(xScale).ticks(6));
      svg.append("g")
        .attr("class", "axis")
        .call(d3.axisLeft(yScale).ticks(6));

      // Axis labels
      svg.append("text")
        .attr("x", width / 2).attr("y", height + 30)
        .attr("text-anchor", "middle").style("font-size", "12px")
        .text("x");
      svg.append("text")
        .attr("x", -height / 2).attr("y", -30)
        .attr("transform", "rotate(-90)")
        .attr("text-anchor", "middle").style("font-size", "12px")
        .text("y");

      // Regression line (drawn first so dots sit on top)
      svg.append("line")
        .attr("class", "fit")
        .attr("x1", xScale(2))  .attr("y1", yScale(slope * 2  + intercept))
        .attr("x2", xScale(20)) .attr("y2", yScale(slope * 20 + intercept));

      // The dots
      svg.selectAll("circle")
        .data(points)
        .enter()
        .append("circle")
          .attr("class", "dot")
          .attr("cx", d => xScale(d.x))
          .attr("cy", d => yScale(d.y))
          .attr("r", 5);
    });
  </script>

</body>
</html>
