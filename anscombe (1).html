<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Anscombe</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    .chart { display: inline-block; margin: 10px; }
  </style>
</head>
<body>

<h2>Anscombe's Quartet</h2>
<p>WRITE ONE OR TWO SENTENCES HERE IN YOUR OWN WORDS</p>

<div id="charts"></div>

<script>
var x = [10, 8, 13, 9, 11, 14, 6, 4, 12, 7, 5];
var x4 = [8, 8, 8, 8, 8, 8, 8, 19, 8, 8, 8];

var data = [
  { title: "I",   x: x,  y: [8.04, 6.95, 7.58, 8.81, 8.33, 9.96, 7.24, 4.26, 10.84, 4.82, 5.68] },
  { title: "II",  x: x,  y: [9.14, 8.14, 8.74, 8.77, 9.26, 8.10, 6.13, 3.10, 9.13, 7.26, 4.74] },
  { title: "III", x: x,  y: [7.46, 6.77, 12.74, 7.11, 7.81, 8.84, 6.08, 5.39, 8.15, 6.42, 5.73] },
  { title: "IV",  x: x4, y: [6.58, 5.76, 7.71, 8.84, 8.47, 7.04, 5.25, 12.50, 5.56, 7.91, 6.89] }
];

var w = 300;
var h = 250;
var pad = 30;

// same scale for all 4
var xScale = d3.scaleLinear().domain([0, 20]).range([pad, w - pad]);
var yScale = d3.scaleLinear().domain([0, 14]).range([h - pad, pad]);

for (var i = 0; i < data.length; i++) {
  var d = data[i];

  var div = d3.select("#charts").append("div").attr("class", "chart");
  div.append("p").text(d.title);

  var svg = div.append("svg").attr("width", w).attr("height", h);

  svg.append("g")
    .attr("transform", "translate(0," + (h - pad) + ")")
    .call(d3.axisBottom(xScale));

  svg.append("g")
    .attr("transform", "translate(" + pad + ",0)")
    .call(d3.axisLeft(yScale));

  for (var j = 0; j < d.x.length; j++) {
    svg.append("circle")
      .attr("cx", xScale(d.x[j]))
      .attr("cy", yScale(d.y[j]))
      .attr("r", 4)
      .attr("fill", "black");
  }
}
</script>

</body>
</html>
