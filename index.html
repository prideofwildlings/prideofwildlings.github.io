<!DOCTYPE html>
<html>
    <head>
        <title>Anscombe's Quartet</title>
           <style>
     #grid {
       display: grid;
       grid-template-columns: repeat(2, max-content);
       gap: 24px;
       justify-content: center;
     }
        body {
     background: #0a1420;
     color: #a9d6e5;
     font-family: "Courier New", monospace;
     text-align: center;
   }
      svg {
     box-shadow: 0 0 20px rgba(169, 214, 229, 0.35);
   }
   </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    </head>
    <body>
        <h1>Anscombe's Quartet </h1>
        <p>Late, but correctly binned.</p>
        <div id="grid"></div>
        <script>
          console.log(d3.version);
        const x1 = [10, 8, 13, 9, 11, 14, 6, 4, 12, 7, 5];
        const y1 = [8.04, 6.95, 7.58, 8.81, 8.33, 9.96, 7.24, 4.26, 10.84, 4.82, 5.68];
        const x2 = [10, 8, 13, 9, 11, 14, 6, 4, 12, 7, 5];
        const y2 = [9.14, 8.14, 8.74, 8.77, 9.26, 8.10, 6.13, 3.10, 9.13, 7.26, 4.74];
        const x3 = [10, 8, 13, 9, 11, 14, 6, 4, 12, 7, 5];
        const y3 = [7.46, 6.77, 12.74, 7.11, 7.81, 8.84, 6.08, 5.39, 8.15, 6.42, 5.73];
        const x4 = [8, 8, 8, 8, 8, 8, 8, 19, 8, 8, 8];
        const y4 = [6.58, 5.76, 7.71, 8.84, 8.47, 7.04, 5.25, 12.50, 5.56, 7.91, 6.89];
          console.log(x1);
          console.log(y1);
          console.log(x2);
          console.log(y2);
          console.log(x3);
          console.log(y3);
          console.log(x4);
          console.log(y4);
            function drawChart(xs, ys) {
            const svg = d3.select("#grid")
                .append("svg")
                .attr("width", 400)
                .attr("height", 300)
                .style("border", "2px solid #a9d6e5")
                .style("background", "#0d1b2a")
                .style("border-radius", "16px");
            const xScale = d3.scaleLinear()
                .domain([0, 20])
                .range([40, 380]);
            const yScale = d3.scaleLinear()
  .domain([0, 14])
  .range([260, 20]);

console.log(yScale(0));
console.log(yScale(14));

console.log(xScale(10));
svg.append("g")
  .attr("transform", "translate(0, 260)")
  .style("color", "#a9d6e5")
  .call(d3.axisBottom(xScale));
  svg.append("g")
  .attr("transform", "translate(40, 0)")
  .style("color", "#a9d6e5")
  .call(d3.axisLeft(yScale));
  svg.selectAll("circle")
  .data(xs)
  .enter()
  .append("circle")
  .attr("cx", (d, i) => xScale(xs[i]))
  .attr("cy", (d, i) => yScale(ys[i]))
  .attr("r", 4)
  .attr("fill", "#a9d6e5");
  }
    drawChart(x1, y1);
    drawChart(x2, y2);
    drawChart(x3, y3);
    drawChart(x4, y4);
         </script>
    </body>
</html>
